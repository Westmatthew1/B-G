<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Thank You — BPromise Oboh</title>
  <style>
    :root {
      --royal: #0b3d91;
      --red: #c91f1f;
      --white: #ffffff;
    }

    html,body {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(120deg, var(--red) 0%, var(--royal) 100%);
      color: var(--white);
    }

    .wrap {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
       padding: 40px 20px;
      box-sizing: border-box;
      text-align: center;
      flex-direction: column;
    }

    .card {
      background: rgba(255,255,255,0.06);
      padding: 30px 28px;
      border-radius: 14px;
      max-width: 720px;
      width: 100%;
      backdrop-filter: blur(6px);
      box-shadow: 0 12px 36px rgba(0,0,0,0.25);
    }

    /* SVG container */
    .svg-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }

    /* Big heading */
    h1 {
      margin: 8px 0 6px;
      font-size: 1.6rem;
      color: var(--white);
      letter-spacing: -0.2px;
    }

    p {
      margin: 0 0 18px;
      color: rgba(255,255,255,0.92);
      font-size: 1rem;
    }

    .btn {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 8px;
      background: var(--white);
      color: var(--royal);
      text-decoration: none;
      font-weight: 700;
      box-shadow: 0 6px 18px rgba(0,0,0,0.2);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(0,0,0,0.28); }

    /* SVG animation specifics */
    svg.check {
      width: 110px;
      height: 110px;
      overflow: visible;
      display: block;
    }

    /* circle stroke anim */
    .circle {
      fill: none;
      stroke: rgba(255,255,255,0.22);
      stroke-width: 6;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      animation: circle-draw 700ms ease-out forwards;
    }

    /* check path */
    .tick {
      fill: none;
      stroke: var(--white);
      stroke-width: 6.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: tick-draw 600ms 520ms cubic-bezier(.2,.9,.3,1) forwards;
    }

    /* subtle pop */
    .card { transform: translateY(8px); opacity: 0; animation: pop-in .45s ease-out .12s forwards; }
    @keyframes pop-in {
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes circle-draw {
      to { stroke-dashoffset: 0; }
    }
    @keyframes tick-draw {
      to { stroke-dashoffset: 0; }
    }

    /* responsive adjustments */
    @media (max-width:420px) {
      svg.check { width: 88px; height: 88px; }
      h1 { font-size: 1.3rem; }
      .card { padding: 22px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" role="status" aria-live="polite">
      <div class="svg-wrap" aria-hidden="true">
        <!-- Inline SVG: circle + right-facing check path -->
        <svg class="check" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
          <!-- Outer circular ring -->
          <circle class="circle" cx="60" cy="60" r="48"></circle>

          <!-- Right-facing check path (designed to draw left-to-right) -->
          <path class="tick" d="M38 64 L54 78 L84 44"></path>
        </svg>
      </div>

      <h1>Thank you — message sent!</h1>
      <p>Your message has been received. We'll reply as soon as possible.</p>

      <a class="btn" href="index.html">Back to Home</a>
    </div>
  </div>
</body>
</html>
